services:
  relay:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/srv/unibot-cloud/data
    expose:
      - "8787"

  # TLS termination. Set CLOUD_DOMAIN in .env (e.g. cloud.unibot.cn); Caddy
  # fetches and renews the certificate on its own.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CLOUD_DOMAIN: ${CLOUD_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay

volumes:
  caddy_data:
  caddy_config:
