[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "unibot"
version = "1.0.3"
description = "An open-source personal AI agent inspired by Meta's Muse: it does the work, a Sentinel decides what may run, and it reaches services through APIs, MCP servers, CLIs or the phone's screen. Phone today, web and desktop next. Bring your own model."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "unibot Contributors" }]
keywords = ["agent", "ai", "llm", "personal-assistant", "personal-agent", "muse", "meta-muse", "gui-agent", "mcp", "deepseek", "feishu", "amap"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "openai>=3.22.1",
  "pydantic>=2.13.5",
  "httpx>=0.28.1",
  "typer>=0.27.2",
  "rich>=15.0.0",
  "loguru>=0.7.3",
  "cryptography>=50.0.2",
  "tenacity>=9.1.4",
  "ddgs>=9.16.0",
  "beautifulsoup4>=4.15.0",
  "html2text>=2025.4.15",
  "mcp>=2.2.0",
  "fastapi>=0.142.2",
  "uvicorn[standard]>=0.54.0",
  "qrcode>=8.2",
  "pywebpush>=2.5.0",
  "python-dateutil>=2.9.0.post0",
  "pillow>=12.3.0",
  "pypdf>=6.19.0",
  # Windows has no system time-zone database; zoneinfo (the calendar, quiet hours) needs this one
  "tzdata>=2026.4; platform_system == 'Windows'",
]

[project.optional-dependencies]
browser = ["playwright>=1.63.0"]
# this computer's screen and hands (docs/every-device.md); xdotool works without them on X11
hands = ["mss>=10.2.0", "Pillow>=10", "pyautogui>=0.9.54", "pyperclip>=1.11.0"]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.16.9", "mypy>=2.3.1", "httpx>=0.28.1", "types-python-dateutil"]
all = ["unibot[browser,hands,dev]"]

[project.scripts]
unibot = "unibot.cli:app"
# the CLI bridge: for commands the agent runs (docs/local-runtime.md)
unibot-device = "unibot.bridge.cli:device_main"
unibot-browser = "unibot.bridge.cli:browser_main"
unibot-open = "unibot.bridge.cli:open_main"

[project.urls]
Homepage = "https://github.com/unictoai/unibot"
Repository = "https://github.com/unictoai/unibot"
Issues = "https://github.com/unictoai/unibot/issues"

[tool.hatch.build.targets.wheel]
packages = ["unibot"]

[tool.hatch.build.targets.wheel.force-include]
"config/config.example.toml" = "unibot/config.example.toml"

[tool.hatch.build.targets.sdist]
include = ["unibot", "config/config.example.toml", "README.md", "README_*.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
files = ["unibot"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unreachable = true
# the mcp 1.x/2.x import fallback needs an ignore on whichever branch is not installed
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: tests that call a real LLM endpoint (set UNIBOT_LIVE=1)"]
