name: Release APK

# Builds a signed release APK from a version tag (v0.1.0, v0.2.0, ...) and
# publishes it as a GitHub Release. The signing key lives in repository
# secrets (added once, by hand): KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NDK_VERSION: 27.2.12479018

jobs:
  release-apk:
    name: signed release APK · arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # android/deps/proot (our fork)

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: android/deps/rclone-mobile/go.sum

      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36 build-tools;35.0.0 cmake;3.22.1 ndk;${{ env.NDK_VERSION }}

      - uses: gradle/actions/setup-gradle@v5

      - name: Native artifacts (proot, Alpine rootfs, rclone.aar)
        env:
          GOTOOLCHAIN: auto
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export GOROOT="$(go env GOROOT)" GOPATH="$(go env GOPATH)"
          export PATH="$GOPATH/bin:$PATH" # gomobile / gobind land there
          bash scripts/android/build-natives.sh

      - name: Write release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/unibot-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../../unibot-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "keystore written"

      - name: assembleRelease
        id: assemble
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          set -o pipefail
          ./gradlew :app:assembleRelease --console=plain --no-daemon 2>&1 | tee "$RUNNER_TEMP/assemble.log"

      - name: Report assembleRelease failure
        if: failure() && steps.assemble.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # CI job logs are not readable without auth; publish the failure tail
          # as an issue so it can be diagnosed.
          { echo 'assembleRelease failed. Tail of the Gradle log:'; echo '```'; tail -c 30000 "$RUNNER_TEMP/assemble.log"; echo '```'; } > /tmp/assemble-tail.txt || true
          gh issue create --title "Release ${{ github.ref_name }}: assembleRelease failed" \
            --body-file /tmp/assemble-tail.txt || true

      - name: Badging
        run: |
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$bt/aapt" dump badging android/src/android/app/build/outputs/apk/release/app-release.apk | grep -E "^package:|application-label:|native-code"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          apk="unibot-${version}-arm64.apk"
          cp android/src/android/app/build/outputs/apk/release/app-release.apk "$apk"
          notes="unibot ${tag} — signed release APK (arm64-v8a).

          Install: download the APK on your phone and open it. Updates install over previous unibot releases (same signing key)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --title "unibot $tag" --notes "$notes"
          fi
