name: Voice model

# One-time (and on-demand) publisher for unibot's offline speech-to-text
# models. The app never bundles a model in the APK — the user picks a size
# (Quick ~31 MB / Balanced ~57 MB / Best ~181 MB) in the voice panel and it
# fetches the file from the voice-model-v1 GitHub release below.
#
# Runs when this file is pushed (so the first push publishes the models)
# and on manual dispatch for re-publishing.

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/voice-model.yml"]

permissions:
  contents: write

env:
  # file|upstream-url|min-bytes — one per line.
  MODEL_SPECS: |
    ggml-tiny.en-q5_1.bin|https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en-q5_1.bin|29000000
    ggml-base.en-q5_1.bin|https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q5_1.bin|55000000
    ggml-small.en-q5_1.bin|https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en-q5_1.bin|180000000

jobs:
  publish:
    name: publish voice models
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Download models from upstream
        run: |
          set -euo pipefail
          mkdir -p voice-models
          while IFS='|' read -r file url min_bytes; do
            [ -z "$file" ] && continue
            echo "downloading $file ..."
            curl -sSL --retry 3 -o "voice-models/$file" "$url"
            bytes=$(stat -c%s "voice-models/$file")
            echo "  $bytes bytes"
            if [ "$bytes" -lt "$min_bytes" ]; then
              echo "model file too small ($bytes bytes) — refusing to publish" >&2
              exit 1
            fi
          done <<< "$MODEL_SPECS"

      - name: Publish to voice-model-v1 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view voice-model-v1 >/dev/null 2>&1 || \
            gh release create voice-model-v1 \
              --title "Offline voice model v1" \
              --notes "whisper.cpp English q5_1 models for unibot's on-device speech-to-text (tiny ~31 MB, base ~57 MB, small ~181 MB). Downloaded in-app only when the user chooses a size — never bundled in the APK."
          gh release upload voice-model-v1 voice-models/* --clobber
          echo "published:"
          gh release view voice-model-v1 --json assets -q '.assets[].name'
