[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "unibot-desktop"
dynamic = ["version"] # unibot_desktop/__init__.py, the one place
description = "unibot Desktop: the computer's Muse — hands on this machine and, through the hub, on every other device of the account."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
screen = ["mss>=9", "pillow>=10"]
dev = ["pytest>=8", "ruff>=0.5", "pyinstaller>=6.6", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]

[project.scripts]
unibot-desktop = "unibot_desktop.__main__:main"

[tool.hatch.version]
path = "unibot_desktop/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["unibot_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
